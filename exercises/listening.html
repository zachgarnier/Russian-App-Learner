<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Listening Practice — Russian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="app-header">
      <a class="back-btn" href="../index.html">←</a>
      <div>
        <h1>Listening Practice</h1>
        <div class="subtitle" id="streak-label">🔥 0 day streak</div>
      </div>
    </div>

    <div class="hf-toggle-row">
      <a class="hf-mode-link" href="handsfree.html">🎧 Switch to hands-free mode (Bluetooth remote) →</a>
    </div>

    <div class="stats-row">
      <div class="ring-wrap">
        <svg class="progress-ring" viewBox="0 0 80 80">
          <circle class="ring-track" cx="40" cy="40" r="34"></circle>
          <circle class="ring-fill" id="ring-fill" cx="40" cy="40" r="34"></circle>
        </svg>
        <div class="ring-label">
          <span id="ring-count">0</span>
          <small>/ <span id="ring-target">20</span></small>
        </div>
      </div>
      <div class="stats-side">
        <div class="stats-title">Today's goal</div>
        <div class="overall-bar-track">
          <div class="overall-bar-fill" id="overall-fill" style="width: 0%;"></div>
        </div>
        <div class="overall-label" id="overall-label">0 / 0 mastered</div>
      </div>
    </div>

    <!-- Swipe deck -->
    <div class="deck" id="deck">
      <div class="ghost-card ghost-2"></div>
      <div class="ghost-card ghost-1"></div>

      <div class="swipe-card" id="swipe-card">
        <div class="swipe-overlay know" id="overlay-know">KNOW IT</div>
        <div class="swipe-overlay again" id="overlay-again">AGAIN</div>

        <div class="listen-row">
          <button class="listen-btn" id="listen-btn" aria-label="Listen">🔊</button>
          <button class="slower-btn" id="slower-btn" aria-label="Play slower">🐢</button>
        </div>
        <div class="listen-hint" id="listen-hint">Tap to hear, then swipe</div>

        <div class="reveal-box hidden-text" id="reveal-box">Tap to reveal</div>
      </div>
    </div>

    <div class="status-line" id="status-line"></div>

    <!-- Session complete screen -->
    <div class="complete-screen" id="complete-screen" style="display: none;">
      <div class="complete-emoji">🎉</div>
      <h2>Session complete!</h2>
      <p id="complete-summary">You got 20 sentences today.</p>

      <div class="complete-stats">
        <div class="complete-stat">
          <div class="complete-stat-value" id="complete-streak">0</div>
          <div class="complete-stat-label">🔥 streak</div>
        </div>
        <div class="complete-stat">
          <div class="complete-stat-value" id="complete-mastered">0</div>
          <div class="complete-stat-label">mastered</div>
        </div>
        <div class="complete-stat">
          <div class="complete-stat-value" id="complete-pct">0%</div>
          <div class="complete-stat-label">of 10,000</div>
        </div>
      </div>

      <button class="pill-btn wide bonus-btn" id="bonus-btn">➕ Bonus round (+10)</button>
      <a class="nav-row-link" href="../index.html">Done for today</a>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/listening.js"></script>
</body>
</html>
