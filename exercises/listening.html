<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Listening Practice — Russian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="app-header">
      <a class="back-btn" href="../index.html">←</a>
      <div>
        <h1>Listening Practice</h1>
        <div class="subtitle">Hear a sentence, guess it, reveal the text.</div>
      </div>
    </div>

    <div class="hf-toggle-row">
      <a class="hf-mode-link" href="handsfree.html">🎧 Switch to hands-free mode (Bluetooth remote) →</a>
    </div>

    <div class="stats-row">
      <div class="stats-side">
        <div class="stats-title">Sentences learned</div>
        <div class="overall-bar-track">
          <div class="overall-bar-fill" id="overall-fill" style="width: 0%;"></div>
        </div>
        <div class="overall-label" id="overall-label">0 / 0 done</div>
      </div>
    </div>

    <!-- Swipe deck -->
    <div class="deck" id="deck">
      <div class="ghost-card ghost-2"></div>
      <div class="ghost-card ghost-1"></div>

      <div class="swipe-card" id="swipe-card">
        <div class="swipe-overlay know" id="overlay-know">KNOW IT</div>
        <div class="swipe-overlay again" id="overlay-again">AGAIN</div>

        <div class="listen-row">
          <button class="listen-btn" id="listen-btn" aria-label="Listen">🔊</button>
          <button class="slower-btn" id="slower-btn" aria-label="Play slower">🐢</button>
        </div>
        <div class="listen-hint" id="listen-hint">Tap to hear, then swipe</div>

        <div class="reveal-box hidden-text" id="reveal-box">Tap to reveal</div>
      </div>
    </div>

    <div class="status-line" id="status-line"></div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/listening.js"></script>
</body>
</html>
